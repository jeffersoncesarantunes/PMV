name: CodeQL Analysis

on: [push, pull_request]

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: none
      - uses: github/codeql-action/analyze@v4