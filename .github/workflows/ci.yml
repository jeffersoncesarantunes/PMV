name: PMV CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for banned functions
        run: '! grep -rn "\<gets(" src/ include/ || exit 1'
      - name: Check for format string misuse
        run: '! grep -rnE "\bprintf\([^,]*\"%[^%]*\"" src/ include/ || true'
      - name: Check headers are included via include/
        run: 'grep -q "#include \"pmv.h\"" src/*.c && echo "header OK"'
      - name: Verify Makefile targets exist
        run: 'test -f Makefile && grep -q "^install:" Makefile && echo "Makefile OK"'
      - name: Check C formatting
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          clang-format --version
          find src include -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror --output-replacements-xml | grep -q "<replacement " && { echo "Formatting issues found. Run: clang-format -i src/*.c include/*.h"; exit 1; } || echo "Formatting OK"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: make test

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: "8.0"
          usesh: true
          prepare: |
            pkg_add gmake python3
          run: |
            gmake verify
